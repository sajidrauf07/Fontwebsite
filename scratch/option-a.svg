<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" className="tlb-emblem-svg" aria-hidden="true">
  <defs>
    <linearGradient id="tlbCosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>

    <linearGradient id="tlbRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="30%" stop-color="#A855F7" />
      <stop offset="65%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <linearGradient id="tlbTGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="tlbLGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>

    <linearGradient id="tlbBGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <linearGradient id="tlbStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="tlbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Badge with Dual Ring -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#tlbCosmicBg)" stroke="url(#tlbRingGrad)" stroke-width="1.8" />

  <!-- Glass Specular Highlight Curve -->
  <path d="M 5 13 Q 24 6 43 13" stroke="rgba(255, 255, 255, 0.32)" stroke-width="1.2" stroke-linecap="round" />

  <!-- The Three Intertwined Monogram Letters -->
  <g filter="url(#tlbShadow)">
    <!-- T: Dynamic Left Crown -->
    <path d="M 8.5 15.5 C 8.5 14.1 9.6 13 11 13 H 21 C 22.4 13 23.5 14.1 23.5 15.5 C 23.5 16.9 22.4 18 21 18 H 18 V 32.5 C 18 33.9 16.9 35 15.5 35 C 14.1 35 13 33.9 13 32.5 V 18 H 11 C 9.6 18 8.5 16.9 8.5 15.5 Z" fill="url(#tlbTGrad)" />

    <!-- L: Central Stem + Sweeping Underline Base -->
    <path d="M 19 19 C 19 17.9 19.9 17 21 17 C 22.1 17 23 17.9 23 19 V 31.5 H 28 C 29.1 31.5 30 32.4 30 33.5 C 30 34.6 29.1 35.5 28 35.5 H 20.5 C 19.7 35.5 19 34.8 19 34 V 19 Z" fill="url(#tlbLGrad)" />

    <!-- B: Bold Sculptural Curves -->
    <path d="M 26.5 14.5 C 26.5 13.4 27.4 12.5 28.5 12.5 H 33.5 C 36.5 12.5 39 14.7 39 17.5 C 39 19.3 38 20.9 36.4 21.7 C 38.6 22.6 40 24.7 40 27.2 C 40 30.5 37.3 33 34 33 H 28.5 C 27.4 33 26.5 32.1 26.5 31 V 14.5 Z" fill="url(#tlbBGrad)" />

    <!-- B Counter Insets -->
    <rect x="29.75" y="15.75" width="4.5" height="4.5" rx="1.5" fill="#111827" />
    <rect x="29.75" y="23.75" width="5.25" height="5" rx="1.5" fill="#111827" />
  </g>

  <!-- 4-Point Sparkle Flare in Top-Right Corner -->
  <path d="M 37.5 7 L 38.7 10.2 L 42 11.4 L 38.7 12.6 L 37.5 16 L 36.3 12.6 L 33 11.4 L 36.3 10.2 Z" fill="url(#tlbStarGrad)" />
  <circle cx="37.5" cy="11.4" r="0.9" fill="#FFFFFF" />
</svg>